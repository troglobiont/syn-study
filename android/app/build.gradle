plugins { id 'com.android.application' }

android {
    namespace 'io.github.troglobiont.synstudy'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.troglobiont.synstudy'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDirs = ["$buildDir/generated/synAssets"]
}

tasks.register('bundleWebAssets', Copy) {
    from('../../dist') { exclude 'sw.js' }
    into("$buildDir/generated/synAssets/syn")
}
tasks.named('preBuild').configure { dependsOn 'bundleWebAssets' }

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
