name: Android · APK and device tests
on:
  push:
    branches: [main]
    paths: ['android/**', 'dist/**', 'tests/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Check learning engine
        run: node --test tests/*.test.js
      - name: Build bundled application
        run: gradle -p android --no-daemon assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Align unsigned release for private local signing
        run: |
          mkdir -p native-artifact
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk native-artifact/SYN-Study-Android-unsigned.apk
          cp "$tools/lib/apksigner.jar" native-artifact/apksigner.jar
          cp "$tools/NOTICE.txt" native-artifact/ANDROID-TOOLS-NOTICE.txt
          sha256sum native-artifact/* > native-artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: syn-android-unsigned-for-local-signing
          path: native-artifact/
          retention-days: 7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise installed Android app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            gradle -p android --no-daemon connectedDebugAndroidTest; result=$?; adb pull /sdcard/Download/SYN-Study-last.png native-artifact/Android_Last.png; adb pull /sdcard/Download/SYN-Study-home.png native-artifact/Android_Home.png; capture=$?; if [ "$result" -ne 0 ]; then exit "$result"; fi; exit "$capture"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syn-android-test-report
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            native-artifact/Android_Home.png
            native-artifact/Android_Last.png
          retention-days: 14
